background {
    monitor = 
    path = ~/Wallpapers/Cars/3.jpg
    blur_passes = 2
    vibrancy = 0
}

input-field {
    monitor = 
    dots_size = 0.27
    dots_center = true
    size = 350, 50
    inner_color = rgba(181, 202, 224, 0.3)
    fade_on_empty = false
    font_color = rgba(255,255,255,0.95)
    placeholder_text = $FAIL
    outer_color =  rgba(181, 202, 224, 0.3)
    position = 0, -275

  }
  bezier =  linear, 1, 1, 0, 0
animation = fade, 1, 1.8, linear
  label {
      monitor = 
      text = $DESC
      font_size = 30
      font_family = UnifrakturMaguntia
      position = 0, -200
    }
    
  label {
      monitor = 
      text = $TIME
      font_size = 100
      font_family = UnifrakturMaguntia
      position = 0, 375
      shadow_passes = 4
      shadow_boots = 1.7
    }
    
