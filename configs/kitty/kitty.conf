cursor_trail 10


# BEGIN_KITTY_THEME
# Tokyo Night

include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="0xProto Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
map alt+tab next_window
map alt+up resize_window taller
map alt+down resize_window shorter
map alt+c copy_to_clipboard
map alt+v paste_from_clipboard
map alt+left send_key home
map alt+right send_key end
# END_KITTY_FONTS
