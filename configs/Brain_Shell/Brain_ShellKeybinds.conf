# ==============================================================================
# Brain Shell Keybinds
# Auto-generated by Quickshell. Do not edit manually.
# ==============================================================================

# ==============================================================================
# BrainShell Capture Submap (Disables all normal binds during recording)
# ==============================================================================
submap = BrainShell_clean
bind = CTRL, ESCAPE, exec, notify-send 'BrainShell' 'Emergency Exit: Keybinds re-enabled.'
bind = CTRL, ESCAPE, submap, reset
submap = reset

# ==============================================================================
# User Defined Bindings
# ==============================================================================

# Dashboard
bind = SUPER, D, exec, brain-shell ipc call dashboard-home toggle
bind = CTRL SHIFT, ESCAPE, exec, brain-shell ipc call dashboard-stats toggle
bind = SUPER SHIFT, Z, exec, brain-shell ipc call dashboard-kanban toggle
bind = SUPER SHIFT, Q, exec, brain-shell ipc call dashboard-launcher toggle
bind = SUPER SHIFT, K, exec, brain-shell ipc call dashboard-config toggle

# Popups
bind = SUPER, ESCAPE, exec, brain-shell ipc call PowerMenu-toggle toggle
bind = SUPER, N, exec, brain-shell ipc call notification-toggle toggle
bind = SUPER, W, exec, brain-shell ipc call wallpaper-toggle toggle
bind = SUPER SHIFT, C, exec, brain-shell ipc call clipboard-toggle toggle

# Network Tabs
bind = SUPER ALT, W, exec, brain-shell ipc call wifi-toggle toggle
bind = SUPER ALT, B, exec, brain-shell ipc call bluetooth-toggle toggle
bind = SUPER ALT, G, exec, brain-shell ipc call vpn-toggle toggle
bind = SUPER ALT, H, exec, brain-shell ipc call hotspot-toggle toggle

# Audio Tabs
bind = SUPER SHIFT, A, exec, brain-shell ipc call audioOut-toggle toggle
bind = SUPER ALT, I, exec, brain-shell ipc call audioIn-toggle toggle
bind = SUPER SHIFT, M, exec, brain-shell ipc call audioMix-toggle toggle

# Quick Settings
bind = SUPER, B, exec, brain-shell ipc call focus-toggle toggle
bind = SUPER, X, exec, brain-shell ipc call lock-session toggle
bind = , PRINT, exec, brain-shell ipc call screenshot-toggle toggle
bind = ALT, F9, exec, brain-shell ipc call screenrec-on toggle
